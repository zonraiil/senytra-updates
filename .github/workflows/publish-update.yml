name: Senytra güncellemesini yayınla

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - update-stable.json
  workflow_dispatch:
    inputs:
      release_tag:
        description: Yayın etiketi (ör. v2.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: senytra-stable-update
  cancel-in-progress: false

jobs:
  publish-manifest:
    runs-on: windows-latest
    steps:
      - name: Ana dalı al
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release bilgilerini doğrula ve kurucuyu indir
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            try {
              $draft = Get-Content -LiteralPath 'update-stable.json' -Raw | ConvertFrom-Json
            } catch {
              throw 'update-stable.json geçerli JSON değil.'
            }
            $draftVersion = [string]$draft.version
            if ($draftVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw 'update-stable.json içindeki version 2.0.0 biçiminde olmalıdır.'
            }
            $releaseTag = "v$draftVersion"
            $draftNotes = @($draft.changelog | ForEach-Object { [string]$_ }) -join "`n"
          } else {
            $releaseTag = [string]$env:REQUESTED_TAG
            $draftNotes = [string]$env:RELEASE_NOTES
          }
          if ($releaseTag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release etiketi v2.0.0 biçiminde olmalıdır: $releaseTag"
          }
          $version = $Matches[1]
          $assetName = "Senytra-Setup-v$version-x64.exe"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$releaseTag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release bilgisi okunamadı.' }
          $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) {
            throw "Release içinde beklenen kurucu yok: $assetName"
          }
          New-Item -ItemType Directory -Force -Path '.release-artifacts' | Out-Null
          gh release download $releaseTag --pattern $assetName --dir '.release-artifacts' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Kurucu GitHub Release üzerinden indirilemedi.' }
          $notes = if ([string]::IsNullOrWhiteSpace($draftNotes)) { [string]$release.body } else { $draftNotes }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'senytra-release-notes.txt'), $notes, [Text.UTF8Encoding]::new($false))
          "SENYTRA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SENYTRA_ASSET_NAME=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SENYTRA_DOWNLOAD_URL=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Güncelleme imzalama anahtarını hazırla
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.SENYTRA_UPDATE_PRIVATE_KEY_B64 || secrets.SPECTRA_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_B64)) {
            throw 'Senytra güncelleme imzalama anahtarı GitHub Actions sırlarında tanımlanmamış.'
          }
          try {
            $bytes = [Convert]::FromBase64String($env:UPDATE_PRIVATE_KEY_B64)
          } catch {
            throw 'Senytra güncelleme imzalama anahtarı geçerli Base64 değil.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'senytra-update-private.pem'
          [IO.File]::WriteAllBytes($keyPath, $bytes)
          "SENYTRA_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: İmzalı geçiş manifestini oluştur
        shell: pwsh
        run: |
          node scripts/publish-update-manifest.js `
            --version $env:SENYTRA_VERSION `
            --installer ".release-artifacts\$env:SENYTRA_ASSET_NAME" `
            --download $env:SENYTRA_DOWNLOAD_URL `
            --notes-file "$env:RUNNER_TEMP\senytra-release-notes.txt" `
            --private-key $env:SENYTRA_PRIVATE_KEY_PATH `
            --out update-stable.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Manifesti ana dala gönder
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- update-stable.json
          if (git diff --cached --quiet) {
            Write-Host 'Manifest zaten güncel.'
            exit 0
          }
          git commit -m "Yayın manifestini v$env:SENYTRA_VERSION sürümüne güncelle"
          git push origin HEAD:main
